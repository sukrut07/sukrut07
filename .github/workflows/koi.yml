name: Generate Git Koi Animation

on:
  schedule:
    # Runs daily just after midnight UTC (reflecting the day that just ended)
    - cron: '20 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Git Koi
        uses: yalongwastaken/git-koi@v1
        with:
          login: ${{ github.repository_owner }}
          body: white
          output-dir: koi

      # Stage Koi assets for output branch
      - name: Stage Koi assets for output branch
        run: |
          mkdir -p dist/koi
          cp -r koi/* dist/koi/

      # Push generated assets to 'output' branch (keeping existing files)
      - name: Push Koi to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          keep_files: true

      # Also commit koi.gif directly to main branch if changed
      - name: Commit the koi if changed
        shell: bash
        run: |
          git add koi/koi.gif koi/koi.png
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: update daily activity koi"
          git push --quiet
