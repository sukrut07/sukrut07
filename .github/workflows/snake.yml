# Save this file at: .github/workflows/snake.yml
# in your special profile repo => github.com/sukrut07/sukrut07
#
# Setup steps:
# 1. If you don't already have it, create a repo named EXACTLY "sukrut07"
#    (must match your username) and make it public.
# 2. Put your README.md (from this chat) as the README.md of that repo.
# 3. Create the folder .github/workflows/ in that repo and add this file as snake.yml
# 4. Go to repo Settings -> Actions -> General -> Workflow permissions
#    -> set to "Read and write permissions" -> Save
# 5. Go to the "Actions" tab and manually run "generate animation" once
#    (or just wait for the cron / push trigger)
# 6. After it runs successfully, an "output" branch is created with the SVGs,
#    and the snake image in your README will start showing your real contribution graph.

name: generate animation

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  workflow_dispatch:          # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00ff88&color_dots=#1b1f3b,#3b2f6b,#7c3aed,#c026d3,#f97316&color_empty=#0d1117
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00ff88

      - name: Add heatmap blur effect
        run: |
          python3 - <<'PY'
          import re, glob

          BLUR_STD = "0.6"  # increase for softer/blurrier, decrease for sharper

          for path in glob.glob("dist/*.svg"):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              filter_defs = (
                  '<defs><filter id="heatmapBlur" x="-20%" y="-20%" width="140%" height="140%">'
                  f'<feGaussianBlur stdDeviation="{BLUR_STD}" /></filter></defs>'
              )

              # Inject the blur filter + open a blurred group right after the opening <svg ...> tag
              content = re.sub(
                  r"(<svg[^>]*>)",
                  r"\1" + filter_defs + '<g filter="url(#heatmapBlur)">',
                  content,
                  count=1,
              )
              # Close that group right before the final </svg>
              content = re.sub(r"(</svg>\s*)$", r"</g>\1", content)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          PY

      - name: Push snake animation to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

